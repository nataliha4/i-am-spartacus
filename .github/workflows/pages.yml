name: Legacy Pages exporter

on:
  push:
    branches: [main]
    paths:
      - legacy/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Verify legacy exporter is present
        run: |
          test -f legacy/index.html
          test -f legacy/export.js
          test -f legacy/export.css
          grep --fixed-strings 'Export data for the new app' legacy/index.html
      - name: Upload legacy site at its original root URL
        uses: actions/upload-pages-artifact@v5
        with:
          path: legacy
      - name: Deploy legacy exporter
        id: deployment
        uses: actions/deploy-pages@v5
