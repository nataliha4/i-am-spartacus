services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spartacus
      POSTGRES_PASSWORD: spartacus
      POSTGRES_DB: spartacus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spartacus"]
      interval: 2s
      retries: 20
volumes:
  postgres-data:
