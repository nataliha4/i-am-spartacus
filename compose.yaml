services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spartacus
      POSTGRES_PASSWORD: spartacus
      POSTGRES_DB: spartacus
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spartacus"]
      interval: 2s
      retries: 20
  app:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: postgres://spartacus:spartacus@postgres:5432/spartacus
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgres://spartacus:spartacus@postgres:5432/spartacus
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  postgres-data:
