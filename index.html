<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💪 I AM SPARTACUS 💪</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background-color: #fafafa;
    }
    #root {
      width: 100%;
    }
    button {
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus,
    button:focus-visible,
    button:active {
      outline: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DailyTrackerApp = () => {
      const [entries, setEntries] = useState({});
      const [recurringSupps, setRecurringSupps] = useState({});
      const [recurringGym, setRecurringGym] = useState({});
      const [appSettings, setAppSettings] = useState({ targetWeight: '', fastingGoalHours: 16, fastingStartTime: '16:00' });
      const [activeFast, setActiveFast] = useState(null);
      const [nowTick, setNowTick] = useState(0);
      const [currentDate, setCurrentDate] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });
      const [activeTab, setActiveTab] = useState('dashboard');
      const [formData, setFormData] = useState({
        fastingStart: '',
        fastingEnd: '',
        supplement: '',
        supplementTime: '',
        supplementNotes: '',
        symptom: '',
        symptomLevel: 3,
        symptomNotes: '',
        symptomDate: '',
        symptomTime: '',
        weight: '',
        targetWeight: '',
        foodNote: '',
        foodTime: '',
        medicalEvent: '',
        medicalNotes: '',
        gymActivity: '',
        gymNotes: '',
        gymTime: '',
        recurringName: '',
        recurringTime: '',
        recurringFrequency: 'daily',
        recurringDayOfWeek: '1',
        recurringGymName: '',
        recurringGymTime: '',
        recurringGymFrequency: 'daily',
        recurringGymDayOfWeek: '1',
      });

      // Load data from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('trackerData');
        if (saved) {
          try {
            setEntries(JSON.parse(saved));
          } catch (e) {
            console.error('Failed to load saved data');
          }
        }
        const savedRecurring = localStorage.getItem('recurringSupps');
        if (savedRecurring) {
          try {
            setRecurringSupps(JSON.parse(savedRecurring));
          } catch (e) {
            console.error('Failed to load recurring supps');
          }
        }
        const savedRecurringGym = localStorage.getItem('recurringGym');
        if (savedRecurringGym) {
          try {
            setRecurringGym(JSON.parse(savedRecurringGym));
          } catch (e) {
            console.error('Failed to load recurring gym');
          }
        }
        const savedActiveFast = localStorage.getItem('activeFast');
        if (savedActiveFast) {
          try {
            setActiveFast(JSON.parse(savedActiveFast));
          } catch (e) {
            console.error('Failed to load active fast');
          }
        }
        const savedSettings = localStorage.getItem('appSettings');
        if (savedSettings) {
          try {
            setAppSettings(JSON.parse(savedSettings));
          } catch (e) {
            console.error('Failed to load app settings');
          }
        }
      }, []);

      // Tick every 30s so the live elapsed-fasting display stays current
      useEffect(() => {
        const interval = setInterval(() => setNowTick(t => t + 1), 30000);
        return () => clearInterval(interval);
      }, []);

      // Save active fast to localStorage
      useEffect(() => {
        if (activeFast) {
          localStorage.setItem('activeFast', JSON.stringify(activeFast));
        } else {
          localStorage.removeItem('activeFast');
        }
      }, [activeFast]);

      // Save to localStorage whenever entries change
      useEffect(() => {
        localStorage.setItem('trackerData', JSON.stringify(entries));
      }, [entries]);

      // Save recurring supps to localStorage
      useEffect(() => {
        localStorage.setItem('recurringSupps', JSON.stringify(recurringSupps));
      }, [recurringSupps]);

      // Save recurring gym to localStorage
      useEffect(() => {
        localStorage.setItem('recurringGym', JSON.stringify(recurringGym));
      }, [recurringGym]);

      // Save app settings to localStorage
      useEffect(() => {
        localStorage.setItem('appSettings', JSON.stringify(appSettings));
      }, [appSettings]);

      const dateKey = currentDate;

      // Parse a 'YYYY-MM-DD' string as a LOCAL date (avoids the classic JS bug where
      // new Date('YYYY-MM-DD') is parsed as UTC midnight and can display as the previous day)
      const parseLocalDate = (dateStr) => {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d);
      };

      // Format a Date object as 'YYYY-MM-DD' using LOCAL date parts (avoids toISOString(),
      // which converts to UTC first and can shift the date near midnight in some timezones)
      const formatDateLocal = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const getCurrentTimeHHMM = () => {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      };

      const startFast = () => {
        const now = new Date();
        setActiveFast({
          startDateKey: formatDateLocal(now),
          startTime: getCurrentTimeHHMM(),
          startTimestampMs: now.getTime(),
        });
      };

      const stopFast = () => {
        if (!activeFast) return;
        const endTime = getCurrentTimeHHMM();
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });
        const endKey = formatDateLocal(new Date());
        setEntries(prev => {
          const prevDay = prev[endKey] || {};
          const prevFasting = Array.isArray(prevDay.fasting) ? prevDay.fasting : [];
          return {
            ...prev,
            [endKey]: {
              ...prevDay,
              fasting: [...prevFasting, { start: activeFast.startTime, end: endTime, timestamp, id: Date.now() }],
            },
          };
        });
        setActiveFast(null);
      };

      const saveActiveFastStartTime = (newTime) => {
        if (!activeFast || !newTime) return;
        const startDate = parseLocalDate(activeFast.startDateKey);
        const [hh, mm] = newTime.split(':').map(Number);
        startDate.setHours(hh, mm, 0, 0);
        setActiveFast({
          ...activeFast,
          startTime: newTime,
          startTimestampMs: startDate.getTime(),
        });
      };

      const getElapsedFastLabel = () => {
        if (!activeFast) return '';
        const elapsedMs = Date.now() - activeFast.startTimestampMs;
        const totalMinutes = Math.max(0, Math.floor(elapsedMs / 60000));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${hours}h ${minutes}m`;
      };

      const getNextFastPrediction = () => {
        const targetTime = appSettings.fastingStartTime || '16:00';
        const [targetH, targetM] = targetTime.split(':').map(Number);
        const targetTotalMin = targetH * 60 + targetM;

        const now = new Date();
        const nowTotalMin = now.getHours() * 60 + now.getMinutes();
        const diffMin = (targetTotalMin - nowTotalMin + 1440) % 1440;
        const hoursUntil = Math.round(diffMin / 60);

        return { time: targetTime, hoursUntil };
      };

      const getFastTargetEnd = (startTime) => {
        const goalHours = appSettings.fastingGoalHours || 16;
        const [h, m] = startTime.split(':').map(Number);
        const totalMin = h * 60 + m + goalHours * 60;
        const targetMin = totalMin % 1440;
        const nextDay = totalMin >= 1440;
        const targetH = Math.floor(targetMin / 60);
        const targetM = targetMin % 60;
        const time = `${String(targetH).padStart(2, '0')}:${String(targetM).padStart(2, '0')}`;
        return { time, nextDay };
      };

      const formatTime12h = (time24) => {
        if (!time24 || time24 === 'No time set') return time24 || 'No time set';
        const [hStr, mStr] = time24.split(':');
        let h = parseInt(hStr, 10);
        const suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12;
        if (h === 0) h = 12;
        return `${h}:${mStr} ${suffix}`;
      };

      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const selectedDayOfWeek = parseLocalDate(currentDate).getDay();

      const isSuppScheduledToday = (supp) => {
        if (!supp.frequency || supp.frequency === 'daily') return true;
        if (supp.frequency === 'weekly') return parseInt(supp.dayOfWeek, 10) === selectedDayOfWeek;
        return true;
      };

      const getTodayEntries = () => {
        return entries[dateKey] || {};
      };

      const addEntry = (category, data) => {
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });

        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: Array.isArray(prev[dateKey]?.[category])
              ? [...prev[dateKey][category], { ...data, timestamp, id: Date.now() }]
              : [{ ...data, timestamp, id: Date.now() }],
          },
        }));

        // Reset form
        setFormData({
          fastingStart: '',
          fastingEnd: '',
          supplement: '',
          supplementTime: '',
          supplementNotes: '',
          symptom: '',
          symptomLevel: 3,
          symptomNotes: '',
          symptomDate: '',
          symptomTime: '',
          weight: '',
          targetWeight: '',
          foodNote: '',
          foodTime: '',
          medicalEvent: '',
          medicalNotes: '',
          gymActivity: '',
          gymNotes: '',
          gymTime: '',
          recurringName: '',
          recurringTime: '',
          recurringFrequency: 'daily',
          recurringDayOfWeek: '1',
          recurringGymName: '',
          recurringGymTime: '',
          recurringGymFrequency: 'daily',
          recurringGymDayOfWeek: '1',
        });
        setActiveTab('timeline');
      };

      const deleteEntry = (category, id) => {
        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: prev[dateKey][category].filter(item => item.id !== id),
          },
        }));
        setActiveTab('timeline');
      };

      const [editingId, setEditingId] = useState(null);
      const [timelineEditingKey, setTimelineEditingKey] = useState(null);
      const [addEntryType, setAddEntryType] = useState(null);
      const [editingActiveFastStart, setEditingActiveFastStart] = useState(false);
      const [editActiveFastTime, setEditActiveFastTime] = useState('');
      const [editingCategory, setEditingCategory] = useState(null);
      const [editData, setEditData] = useState({});

      const startEdit = (category, entry) => {
        setEditingCategory(category);
        setEditingId(entry.id);
        setEditData({ ...entry });
      };

      const cancelEdit = () => {
        setEditingCategory(null);
        setEditingId(null);
        setEditData({});
      };

      const saveEdit = (category) => {
        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: prev[dateKey][category].map(item =>
              item.id === editingId ? { ...item, ...editData } : item
            ),
          },
        }));
        cancelEdit();
        setActiveTab('timeline');
      };

      const isEditing = (category, id) => editingCategory === category && editingId === id;

      const todayData = getTodayEntries();

      // Calculate fasting status
      const getFastingStatus = () => {
        const fast = todayData.fasting?.[0];
        if (!fast) return null;

        const start = new Date(`${currentDate}T${fast.start}`);
        const end = new Date(`${currentDate}T${fast.end}`);
        let hours = (end - start) / (1000 * 60 * 60);
        // Handle overnight fasts regardless of which day the entry is filed under
        while (hours < 0) hours += 24;

        return { hours: Math.round(hours * 10) / 10, start: fast.start, end: fast.end };
      };

      const isRecurringFailed = (key) => {
        const failed = todayData.failedRecurring || [];
        return failed.includes(key);
      };

      const markRecurringFailed = (key) => {
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              failedRecurring: [...(prevDay.failedRecurring || []), key],
            },
          };
        });
      };

      const clearRecurringFailed = (key) => {
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              failedRecurring: (prevDay.failedRecurring || []).filter(k => k !== key),
            },
          };
        });
      };

      const isRecurringDone = (supp) => {
        const dismissed = todayData.dueDismissed || [];
        return dismissed.includes(`recurring-${supp.id}`);
      };

      const uncheckRecurring = (supp) => {
        const key = `recurring-${supp.id}`;
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              dueDismissed: (prevDay.dueDismissed || []).filter(k => k !== key),
            },
          };
        });
      };

      const confirmRecurringDone = (supp, chosenTime) => {
        const key = `recurring-${supp.id}`;
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          const prevSupplements = Array.isArray(prevDay.supplements) ? prevDay.supplements : [];
          const newEntryId = Date.now();
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              supplements: [...prevSupplements, { name: supp.name, time: chosenTime, notes: '', timestamp, id: newEntryId }],
              dueDismissed: [...(prevDay.dueDismissed || []), key, `logged-${newEntryId}`],
            },
          };
        });
      };

      const [confirmingSuppId, setConfirmingSuppId] = useState(null);
      const [confirmTime, setConfirmTime] = useState('');
      const [confirmingUncheckSuppId, setConfirmingUncheckSuppId] = useState(null);
      const [confirmingUncheckGymId, setConfirmingUncheckGymId] = useState(null);

      const [editingRecurringId, setEditingRecurringId] = useState(null);
      const [editRecurringData, setEditRecurringData] = useState({});

      const startEditRecurring = (supp) => {
        setEditingRecurringId(supp.id);
        setEditRecurringData({ ...supp });
      };

      const cancelEditRecurring = () => {
        setEditingRecurringId(null);
        setEditRecurringData({});
      };

      const saveEditRecurring = () => {
        setRecurringSupps(prev => ({
          ...prev,
          [editingRecurringId]: {
            ...prev[editingRecurringId],
            name: editRecurringData.name,
            time: editRecurringData.time,
            frequency: editRecurringData.frequency || 'daily',
            dayOfWeek: editRecurringData.frequency === 'weekly' ? editRecurringData.dayOfWeek : undefined,
          },
        }));
        cancelEditRecurring();
      };

      const deleteRecurring = (id) => {
        setRecurringSupps(prev => {
          const newSupps = { ...prev };
          delete newSupps[id];
          return newSupps;
        });
        if (editingRecurringId === id) cancelEditRecurring();
      };

      const isRecurringGymDone = (item) => {
        const dismissed = todayData.dueDismissed || [];
        return dismissed.includes(`recurring-gym-${item.id}`);
      };

      const uncheckRecurringGym = (item) => {
        const key = `recurring-gym-${item.id}`;
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              dueDismissed: (prevDay.dueDismissed || []).filter(k => k !== key),
            },
          };
        });
      };

      const confirmRecurringGymDone = (item, chosenTime) => {
        const key = `recurring-gym-${item.id}`;
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          const prevGym = Array.isArray(prevDay.gym) ? prevDay.gym : [];
          const newEntryId = Date.now();
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              gym: [...prevGym, { activity: item.name, time: chosenTime, notes: '', timestamp, id: newEntryId }],
              dueDismissed: [...(prevDay.dueDismissed || []), key],
            },
          };
        });
      };

      const [confirmingGymId, setConfirmingGymId] = useState(null);
      const [confirmGymTime, setConfirmGymTime] = useState('');

      const [editingGymRecurringId, setEditingGymRecurringId] = useState(null);
      const [editGymRecurringData, setEditGymRecurringData] = useState({});

      const startEditRecurringGym = (item) => {
        setEditingGymRecurringId(item.id);
        setEditGymRecurringData({ ...item });
      };

      const cancelEditRecurringGym = () => {
        setEditingGymRecurringId(null);
        setEditGymRecurringData({});
      };

      const saveEditRecurringGym = () => {
        setRecurringGym(prev => ({
          ...prev,
          [editingGymRecurringId]: {
            ...prev[editingGymRecurringId],
            name: editGymRecurringData.name,
            time: editGymRecurringData.time,
            frequency: editGymRecurringData.frequency || 'daily',
            dayOfWeek: editGymRecurringData.frequency === 'weekly' ? editGymRecurringData.dayOfWeek : undefined,
          },
        }));
        cancelEditRecurringGym();
      };

      const deleteRecurringGym = (id) => {
        setRecurringGym(prev => {
          const newItems = { ...prev };
          delete newItems[id];
          return newItems;
        });
        if (editingGymRecurringId === id) cancelEditRecurringGym();
      };

      const fastingStatus = getFastingStatus();

      const getDayTimeline = () => {
        const items = [];

        (todayData.supplements || []).forEach(entry => {
          items.push({
            id: 'supp-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '💊',
            label: entry.name,
            detail: entry.notes || '',
            category: 'supplements',
            entry: entry,
          });
        });

        (todayData.medical || []).forEach(entry => {
          items.push({
            id: 'medical-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '⛑️',
            label: entry.event,
            detail: entry.notes || '',
            category: 'medical',
            entry: entry,
          });
        });

        (todayData.weight || []).forEach(entry => {
          items.push({
            id: 'weight-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🎯',
            label: `Weight: ${entry.weight} kg`,
            detail: entry.target ? `Target: ${entry.target} kg` : '',
            category: 'weight',
            entry: entry,
          });
        });

        (todayData.symptoms || []).forEach(entry => {
          items.push({
            id: 'symp-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🤒',
            label: `${entry.symptom} — Level ${entry.level}/5`,
            detail: entry.notes || '',
            category: 'symptoms',
            entry: entry,
          });
        });

        (todayData.food || []).forEach(entry => {
          items.push({
            id: 'food-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🍎',
            label: entry.note,
            detail: '',
            category: 'food',
            entry: entry,
          });
        });

        (todayData.gym || []).forEach(entry => {
          items.push({
            id: 'gym-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🏋️‍♀️',
            label: entry.activity,
            detail: entry.notes || '',
            category: 'gym',
            entry: entry,
          });
        });

        (todayData.fasting || []).forEach(entry => {
          let crossesMidnight = false;
          let durationLabel = '';
          if (entry.start && entry.end) {
            const [sh, sm] = entry.start.split(':').map(Number);
            const [eh, em] = entry.end.split(':').map(Number);
            const sMin = sh * 60 + sm;
            const eMin = eh * 60 + em;
            crossesMidnight = sMin > eMin;
            const diffH = (eMin - sMin + 1440) % 1440 / 60;
            durationLabel = ` · ${diffH.toFixed(1)}h total`;
          }

          if (crossesMidnight) {
            // Started the previous day — only "Fast ended" belongs on this day's timeline.
            // The start info is folded into this entry's detail, and also shown as a
            // read-only preview on the previous day (see the "peek at tomorrow" block below).
            items.push({
              id: 'fast-end-' + entry.id,
              time: entry.end || null,
              icon: '⏳',
              label: '✅ Fast ended',
              detail: entry.start ? `Started ${formatTime12h(entry.start)}${durationLabel}` : '',
              category: 'fasting',
              entry: entry,
            });
          } else {
            // Same-day fast — both started and ended genuinely happened today, so show both, editable.
            // No green highlight here — that's reserved for a fast that's currently active.
            const target = entry.start ? getFastTargetEnd(entry.start) : null;
            items.push({
              id: 'fast-start-' + entry.id,
              time: entry.start || null,
              icon: '⏳',
              label: '✅ Fast started',
              detail: target ? `until ${formatTime12h(target.time)}${target.nextDay ? ' tomorrow' : ''}` : '',
              category: 'fasting',
              entry: entry,
            });
            items.push({
              id: 'fast-end-' + entry.id,
              time: entry.end || null,
              icon: '⏳',
              label: '✅ Fast ended',
              detail: durationLabel ? durationLabel.replace(' · ', '') : '',
              category: 'fasting',
              entry: entry,
            });
          }
        });

        // Peek at tomorrow's stored fasting entries: if one crosses midnight, it actually
        // started on the day being viewed right now — show a read-only preview here.
        // (The entry itself lives under tomorrow's date, so it isn't editable from here;
        // edit it from tomorrow's "Fast ended" row instead.)
        {
          const nextDate = parseLocalDate(dateKey);
          nextDate.setDate(nextDate.getDate() + 1);
          const nextDateKey = formatDateLocal(nextDate);
          const nextDayFasting = (entries[nextDateKey] && entries[nextDateKey].fasting) || [];
          nextDayFasting.forEach(entry => {
            if (!entry.start || !entry.end) return;
            const [sh, sm] = entry.start.split(':').map(Number);
            const [eh, em] = entry.end.split(':').map(Number);
            const crossesMidnight = (sh * 60 + sm) > (eh * 60 + em);
            if (!crossesMidnight) return;
            const target = getFastTargetEnd(entry.start);
            items.push({
              id: 'fast-start-preview-' + entry.id,
              time: entry.start,
              icon: '⏳',
              label: '✅ Fast started',
              detail: target ? `until ${formatTime12h(target.time)}${target.nextDay ? ' tomorrow' : ''}` : '',
              category: null,

                            <label style={{ fontSize: '13px', color: '#666' }}>Time to remind me</label>
                            <input
                              type="time"
                              value={editRecurringData.time}
                              onChange={e => setEditRecurringData({ ...editRecurringData, time: e.target.value })}
                              style={styles.editInput}
                            />
                            <div style={{ display: 'flex', gap: '0.5rem', marginTop: '0.5rem', flexWrap: 'wrap' }}>
                              <button onClick={saveEditRecurring} style={styles.saveButton}>Save</button>
                              <button onClick={cancelEditRecurring} style={styles.cancelButton}>Cancel</button>
                              <button onClick={() => deleteRecurring(supp.id)} style={styles.deleteButton}>Delete</button>
                            </div>
                          </div>
                        );
                      }

                      return (
                        <div
                          key={supp.id}
                          onClick={() => startEditRecurring(supp)}
                          style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '0.75rem',
                            padding: '1rem 1.25rem',
                            backgroundColor: '#fff',
                            border: '2px solid #e0e0e0',
                            borderRadius: '8px',
                            marginBottom: '0.75rem',
                            cursor: 'pointer',
                          }}
                        >
                          <div style={{ flex: 1, minWidth: 0, fontWeight: '600', fontSize: '17px', color: '#333' }}>
                            {supp.name}
                          </div>
                          <div style={{ fontSize: '15px', color: '#666', fontWeight: '600', flexShrink: 0 }}>
                            {supp.frequency === 'weekly'
                              ? `Weekly (${dayNames[parseInt(supp.dayOfWeek, 10)]}) at ${formatTime12h(supp.time)}`
                              : `Daily at ${formatTime12h(supp.time)}`}
                          </div>
                        </div>
                      );
                    })}
                </div>
              )}

              <div style={styles.card}>
                <div style={styles.cardTitle}>🔁 Add Recurring Supplement</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Supplement name</label>
                  <input
                    type="text"
                    placeholder="e.g., Magnesium"
                    value={formData.recurringName}
                    onChange={e => setFormData({ ...formData, recurringName: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Frequency</label>
                  <select
                    value={formData.recurringFrequency}
                    onChange={e => setFormData({ ...formData, recurringFrequency: e.target.value })}
                    style={styles.select}
                  >
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                  </select>
                </div>
                {formData.recurringFrequency === 'weekly' && (
                  <div style={styles.formGroup}>
                    <label style={styles.label}>Day of week</label>
                    <select
                      value={formData.recurringDayOfWeek}
                      onChange={e => setFormData({ ...formData, recurringDayOfWeek: e.target.value })}
                      style={styles.select}
                    >
                      {dayNames.map((day, idx) => (
                        <option key={idx} value={idx}>{day}</option>
                      ))}
                    </select>
                  </div>
                )}
                <div style={styles.formGroup}>
                  <label style={styles.label}>Time to remind me</label>
                  <input
                    type="time"
                    value={formData.recurringTime}
                    onChange={e => setFormData({ ...formData, recurringTime: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.recurringName && formData.recurringTime) {
                      setRecurringSupps(prev => ({
                        ...prev,
                        [Date.now()]: {
                          id: Date.now(),
                          name: formData.recurringName,
                          time: formData.recurringTime,
                          frequency: formData.recurringFrequency,
                          dayOfWeek: formData.recurringFrequency === 'weekly' ? formData.recurringDayOfWeek : undefined,
                        }
                      }));
                      setFormData({ ...formData, recurringName: '', recurringTime: '', recurringFrequency: 'daily', recurringDayOfWeek: '1' });
                    }
                  }}
                  style={styles.button}
                >
                  Add Recurring Supplement
                </button>
              </div>

              {Object.keys(recurringGym).length > 0 && (
                <div style={styles.card}>
                  <div style={styles.cardTitle}>🔁 Recurring Gym Activities</div>
                  {Object.values(recurringGym)
                    .slice()
                    .sort((a, b) => (a.time || '').localeCompare(b.time || ''))
                    .map(item => {
                      const isEditingThis = editingGymRecurringId === item.id;

                      if (isEditingThis) {
                        return (
                          <div
                            key={item.id}
                            style={{
                              padding: '1rem 1.25rem',
                              backgroundColor: '#fff',
                              border: '2px solid #333',
                              borderRadius: '8px',
                              marginBottom: '0.75rem',
                            }}
                          >
                            <label style={{ fontSize: '13px', color: '#666' }}>Activity name</label>
                            <input
                              type="text"
                              value={editGymRecurringData.name}
                              onChange={e => setEditGymRecurringData({ ...editGymRecurringData, name: e.target.value })}
                              style={styles.editInput}
                            />
                            <label style={{ fontSize: '13px', color: '#666' }}>Frequency</label>
                            <select
                              value={editGymRecurringData.frequency || 'daily'}
                              onChange={e => setEditGymRecurringData({ ...editGymRecurringData, frequency: e.target.value })}
                              style={styles.editInput}
                            >
                              <option value="daily">Daily</option>
                              <option value="weekly">Weekly</option>
                            </select>
                            {editGymRecurringData.frequency === 'weekly' && (
                              <>
                                <label style={{ fontSize: '13px', color: '#666' }}>Day of week</label>
                                <select
                                  value={editGymRecurringData.dayOfWeek ?? '1'}
                                  onChange={e => setEditGymRecurringData({ ...editGymRecurringData, dayOfWeek: e.target.value })}
                                  style={styles.editInput}
                                >
                                  {dayNames.map((day, idx) => (
                                    <option key={idx} value={idx}>{day}</option>
                                  ))}
                                </select>
                              </>
                            )}
                            <label style={{ fontSize: '13px', color: '#666' }}>Time to remind me</label>
                            <input
                              type="time"
                              value={editGymRecurringData.time}
                              onChange={e => setEditGymRecurringData({ ...editGymRecurringData, time: e.target.value })}
                              style={styles.editInput}
                            />
                            <div style={{ display: 'flex', gap: '0.5rem', marginTop: '0.5rem', flexWrap: 'wrap' }}>
                              <button onClick={saveEditRecurringGym} style={styles.saveButton}>Save</button>
                              <button onClick={cancelEditRecurringGym} style={styles.cancelButton}>Cancel</button>
                              <button onClick={() => deleteRecurringGym(item.id)} style={styles.deleteButton}>Delete</button>
                            </div>
                          </div>
                        );
                      }

                      return (
                        <div
                          key={item.id}
                          onClick={() => startEditRecurringGym(item)}
                          style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: '0.75rem',
                            padding: '1rem 1.25rem',
                            backgroundColor: '#fff',
                            border: '2px solid #e0e0e0',
                            borderRadius: '8px',
                            marginBottom: '0.75rem',
                            cursor: 'pointer',
                          }}
                        >
                          <div style={{ flex: 1, minWidth: 0, fontWeight: '600', fontSize: '17px', color: '#333' }}>
                            {item.name}
                          </div>
                          <div style={{ fontSize: '15px', color: '#666', fontWeight: '600', flexShrink: 0 }}>
                            {item.frequency === 'weekly'
                              ? `Weekly (${dayNames[parseInt(item.dayOfWeek, 10)]}) at ${formatTime12h(item.time)}`
                              : `Daily at ${formatTime12h(item.time)}`}
                          </div>
                        </div>
                      );
                    })}
                </div>
              )}

              <div style={styles.card}>
                <div style={styles.cardTitle}>🔁 Add Recurring Gym Activity</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Activity name</label>
                  <input
                    type="text"
                    placeholder="e.g., Planet Fitness — Leg Day"
                    value={formData.recurringGymName}
                    onChange={e => setFormData({ ...formData, recurringGymName: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Frequency</label>
                  <select
                    value={formData.recurringGymFrequency}
                    onChange={e => setFormData({ ...formData, recurringGymFrequency: e.target.value })}
                    style={styles.select}
                  >
                    <option value="daily">Daily</option>
                    <option value="weekly">Weekly</option>
                  </select>
                </div>
                {formData.recurringGymFrequency === 'weekly' && (
                  <div style={styles.formGroup}>
                    <label style={styles.label}>Day of week</label>
                    <select
                      value={formData.recurringGymDayOfWeek}
                      onChange={e => setFormData({ ...formData, recurringGymDayOfWeek: e.target.value })}
                      style={styles.select}
                    >
                      {dayNames.map((day, idx) => (
                        <option key={idx} value={idx}>{day}</option>
                      ))}
                    </select>
                  </div>
                )}
                <div style={styles.formGroup}>
                  <label style={styles.label}>Time to remind me</label>
                  <input
                    type="time"
                    value={formData.recurringGymTime}
                    onChange={e => setFormData({ ...formData, recurringGymTime: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.recurringGymName && formData.recurringGymTime) {
                      setRecurringGym(prev => ({
                        ...prev,
                        [Date.now()]: {
                          id: Date.now(),
                          name: formData.recurringGymName,
                          time: formData.recurringGymTime,
                          frequency: formData.recurringGymFrequency,
                          dayOfWeek: formData.recurringGymFrequency === 'weekly' ? formData.recurringGymDayOfWeek : undefined,
                        }
                      }));
                      setFormData({ ...formData, recurringGymName: '', recurringGymTime: '', recurringGymFrequency: 'daily', recurringGymDayOfWeek: '1' });
                    }
                  }}
                  style={styles.button}
                >
                  Add Recurring Gym Activity
                </button>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DailyTrackerApp />);
  </script>
</body>
</html>
