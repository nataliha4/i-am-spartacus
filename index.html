<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💪 I AM SPARTACUS 💪</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background-color: #fafafa;
    }
    #root {
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DailyTrackerApp = () => {
      const [entries, setEntries] = useState({});
      const [recurringSupps, setRecurringSupps] = useState({});
      const [currentDate, setCurrentDate] = useState(new Date().toISOString().split('T')[0]);
      const [activeTab, setActiveTab] = useState('dashboard');
      const [formData, setFormData] = useState({
        fastingStart: '',
        fastingEnd: '',
        supplement: '',
        supplementTime: '',
        supplementNotes: '',
        symptom: '',
        symptomLevel: 3,
        symptomNotes: '',
        symptomDate: '',
        symptomTime: '',
        weight: '',
        targetWeight: '',
        foodNote: '',
        foodTime: '',
        medicalEvent: '',
        medicalNotes: '',
        gymActivity: '',
        gymNotes: '',
        recurringName: '',
        recurringTime: '',
      });

      // Load data from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('trackerData');
        if (saved) {
          try {
            setEntries(JSON.parse(saved));
          } catch (e) {
            console.error('Failed to load saved data');
          }
        }
        const savedRecurring = localStorage.getItem('recurringSupps');
        if (savedRecurring) {
          try {
            setRecurringSupps(JSON.parse(savedRecurring));
          } catch (e) {
            console.error('Failed to load recurring supps');
          }
        }
      }, []);

      // Save to localStorage whenever entries change
      useEffect(() => {
        localStorage.setItem('trackerData', JSON.stringify(entries));
      }, [entries]);

      // Save recurring supps to localStorage
      useEffect(() => {
        localStorage.setItem('recurringSupps', JSON.stringify(recurringSupps));
      }, [recurringSupps]);

      const dateKey = currentDate;

      const getCurrentTimeHHMM = () => {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      };

      const getTodayEntries = () => {
        return entries[dateKey] || {};
      };

      const addEntry = (category, data) => {
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });

        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: Array.isArray(prev[dateKey]?.[category])
              ? [...prev[dateKey][category], { ...data, timestamp, id: Date.now() }]
              : [{ ...data, timestamp, id: Date.now() }],
          },
        }));

        // Reset form
        setFormData({
          fastingStart: '',
          fastingEnd: '',
          supplement: '',
          supplementTime: '',
          supplementNotes: '',
          symptom: '',
          symptomLevel: 3,
          symptomNotes: '',
          symptomDate: '',
          symptomTime: '',
          weight: '',
          targetWeight: '',
          foodNote: '',
          foodTime: '',
          medicalEvent: '',
          medicalNotes: '',
          gymActivity: '',
          gymNotes: '',
          recurringName: '',
          recurringTime: '',
        });
        setActiveTab('dashboard');
      };

      const deleteEntry = (category, id) => {
        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: prev[dateKey][category].filter(item => item.id !== id),
          },
        }));
      };

      const todayData = getTodayEntries();

      // Calculate fasting status
      const getFastingStatus = () => {
        const fast = todayData.fasting?.[0];
        if (!fast) return null;

        const start = new Date(`${currentDate}T${fast.start}`);
        const end = new Date(`${currentDate}T${fast.end}`);
        if (end < start) end.setDate(end.getDate() + 1);

        const hours = (end - start) / (1000 * 60 * 60);
        return { hours: Math.round(hours * 10) / 10, start: fast.start, end: fast.end };
      };

      const getDueSupplements = () => {
        const now = new Date();
        const currentHour = String(now.getHours()).padStart(2, '0');
        const currentMin = String(now.getMinutes()).padStart(2, '0');
        const currentTime = `${currentHour}:${currentMin}`;
        
        const logged = (todayData.supplements || []).map(s => s.name.toLowerCase());
        
        // Check each logged supplement to see if it's due (past its scheduled time)
        const dueSupps = (todayData.supplements || []).filter(supp => {
          if (!supp.time || supp.time === 'No time set') return false;
          return supp.time <= currentTime;
        });

        // Also check recurring supplements
        const dueRecurring = Object.values(recurringSupps).filter(supp => {
          if (!supp.time) return false;
          return supp.time <= currentTime;
        });
        
        return { logged: dueSupps, recurring: dueRecurring };
      };

      const fastingStatus = getFastingStatus();
      const dueSupps = getDueSupplements();

      const getDayTimeline = () => {
        const items = [];

        (todayData.supplements || []).forEach(entry => {
          items.push({
            id: 'supp-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '💊',
            label: entry.name,
            detail: entry.notes || '',
          });
        });

        (todayData.symptoms || []).forEach(entry => {
          items.push({
            id: 'symp-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🌡️',
            label: `${entry.symptom} — Level ${entry.level}/5`,
            detail: entry.notes || '',
          });
        });

        (todayData.food || []).forEach(entry => {
          items.push({
            id: 'food-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🍎',
            label: entry.note,
            detail: '',
          });
        });

        // Sort by time (entries without a time go to the end)
        items.sort((a, b) => {
          if (!a.time && !b.time) return 0;
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });

        return items;
      };

      const dayTimeline = getDayTimeline();

      const styles = {
        container: {
          maxWidth: '600px',
          margin: '0 auto',
          fontFamily: 'system-ui, -apple-system, sans-serif',
          backgroundColor: '#ffffff',
          minHeight: '100vh',
          padding: '2rem 1.5rem',
        },
        header: {
          display: 'flex',
          justifyContent: 'center',
          alignItems: 'center',
          marginBottom: '2.5rem',
          borderBottom: '2px solid #e0e0e0',
          paddingBottom: '2rem',
        },
        title: {
          fontSize: '30px',
          fontWeight: '700',
          margin: 0,
          letterSpacing: '-0.5px',
          textAlign: 'center',
        },
        subtitle: {
          fontSize: '15px',
          fontWeight: '500',
          color: '#666',
          margin: 0,
          marginTop: '0.5rem',
          textAlign: 'center',
        },
        dateNav: {
          display: 'flex',
          flexDirection: 'column',
          gap: '0.75rem',
          marginBottom: '2.5rem',
        },
        dateNavRow: {
          display: 'flex',
          gap: '0.75rem',
        },
        dateButton: {
          padding: '1rem 0.5rem',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          backgroundColor: '#fff',
          cursor: 'pointer',
          fontSize: '16px',
          color: '#666',
          fontWeight: '600',
          minHeight: '52px',
          flex: 1,
        },
        dateButtonActive: {
          backgroundColor: '#333',
          color: '#fff',
          border: '2px solid #333',
        },
        tabs: {
          display: 'flex',
          gap: '0.5rem',
          marginBottom: '2.5rem',
          borderBottom: '2px solid #e0e0e0',
          overflowX: 'auto',
          paddingBottom: '1rem',
        },
        tab: {
          padding: '0.75rem',
          border: '2px solid transparent',
          backgroundColor: 'transparent',
          cursor: 'pointer',
          fontSize: '26px',
          color: '#666',
          borderRadius: '8px',
          minWidth: '52px',
          minHeight: '52px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          flexShrink: 0,
          lineHeight: 1,
        },
        tabActive: {
          backgroundColor: '#333',
          borderColor: '#333',
        },
        content: {
          marginBottom: '2rem',
        },
        card: {
          backgroundColor: '#f9f9f9',
          border: '2px solid #e0e0e0',
          borderRadius: '12px',
          padding: '2rem',
          marginBottom: '2rem',
        },
        cardTitle: {
          fontSize: '24px',
          fontWeight: '700',
          color: '#333',
          marginBottom: '1.5rem',
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'center',
          letterSpacing: '-0.3px',
        },
        cardLabel: {
          fontSize: '18px',
          color: '#666',
          marginTop: '1.25rem',
          marginBottom: '0.6rem',
          fontWeight: '600',
        },
        formGroup: {
          marginBottom: '2rem',
        },
        label: {
          display: 'block',
          fontSize: '18px',
          fontWeight: '700',
          marginBottom: '0.8rem',
          color: '#333',
          letterSpacing: '-0.2px',
        },
        input: {
          width: '100%',
          padding: '1.25rem',
          fontSize: '20px',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          boxSizing: 'border-box',
          minHeight: '56px',
        },
        select: {
          width: '100%',
          padding: '1.25rem',
          fontSize: '20px',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          boxSizing: 'border-box',
          minHeight: '56px',
        },
        textarea: {
          width: '100%',
          padding: '1.25rem',
          fontSize: '20px',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          minHeight: '120px',
          boxSizing: 'border-box',
          fontFamily: 'inherit',
          resize: 'vertical',
        },
        button: {
          padding: '1.25rem 2rem',
          backgroundColor: '#333',
          color: '#fff',
          border: 'none',
          borderRadius: '8px',
          cursor: 'pointer',
          fontSize: '20px',
          fontWeight: '700',
          minHeight: '56px',
          width: '100%',
          letterSpacing: '-0.3px',
        },
        deleteButton: {
          padding: '0.6rem 0.9rem',
          backgroundColor: '#e74c3c',
          color: '#fff',
          border: 'none',
          borderRadius: '4px',
          cursor: 'pointer',
          fontSize: '15px',
          fontWeight: '600',
        },
        entry: {
          backgroundColor: '#fff',
          border: '2px solid #e0e0e0',
          borderRadius: '10px',
          padding: '1.5rem',
          marginBottom: '1.25rem',
          fontSize: '18px',
          color: '#333',
          lineHeight: '1.8',
          fontWeight: '500',
        },
        entryMeta: {
          fontSize: '16px',
          color: '#999',
          marginTop: '0.75rem',
          fontWeight: '400',
        },
        emptyState: {
          textAlign: 'center',
          color: '#999',
          fontSize: '18px',
          padding: '2.5rem 1.5rem',
        },
        twoColumnForm: {
          display: 'grid',
          gridTemplateColumns: '1fr 1fr',
          gap: '1.5rem',
        },
      };

      return (
        <div style={styles.container}>
          <div style={styles.header}>
            <div>
              <h1 style={styles.title}>💪 I AM SPARTACUS 💪</h1>
              <p style={styles.subtitle}>My Daily Tracker for Health and Activity</p>
            </div>
          </div>

          {/* Date Navigation */}
          <div style={styles.dateNav}>
            <div style={styles.dateNavRow}>
              <button
                style={{ ...styles.dateButton, outline: 'none', WebkitTapHighlightColor: 'transparent' }}
                onClick={e => {
                  const d = new Date(currentDate);
                  d.setDate(d.getDate() - 1);
                  setCurrentDate(d.toISOString().split('T')[0]);
                  e.currentTarget.blur();
                }}
              >
                ← Prev
              </button>
              <button
                style={{
                  ...styles.dateButton,
                  ...(new Date(currentDate).toDateString() === new Date(new Date().toISOString().split('T')[0]).toDateString()
                    ? styles.dateButtonActive
                    : {}),
                  outline: 'none',
                  WebkitTapHighlightColor: 'transparent',
                }}
                onClick={e => {
                  setCurrentDate(new Date().toISOString().split('T')[0]);
                  e.currentTarget.blur();
                }}
              >
                Today
              </button>
              <button
                style={{ ...styles.dateButton, outline: 'none', WebkitTapHighlightColor: 'transparent' }}
                onClick={e => {
                  const d = new Date(currentDate);
                  d.setDate(d.getDate() + 1);
                  setCurrentDate(d.toISOString().split('T')[0]);
                  e.currentTarget.blur();
                }}
              >
                Next →
              </button>
            </div>
            <input
              type="date"
              value={currentDate}
              onChange={e => setCurrentDate(e.target.value)}
              style={{
                ...styles.dateButton,
                cursor: 'pointer',
                textAlign: 'center',
                width: '100%',
                boxSizing: 'border-box',
              }}
            />
          </div>

          {/* Tabs */}
          <div style={styles.tabs}>
            {[
              { key: 'dashboard', icon: '📊', name: 'Dashboard' },
              { key: 'fasting', icon: '⏳', name: 'Fasting' },
              { key: 'supplements', icon: '💊', name: 'Supplements' },
              { key: 'symptoms', icon: '🌡️', name: 'Symptoms' },
              { key: 'weight', icon: '📉', name: 'Weight' },
              { key: 'food', icon: '🍎', name: 'Food' },
              { key: 'medical', icon: '🏥', name: 'Medical' },
              { key: 'gym', icon: '🏋️‍♀️', name: 'Gym' },
            ].map(tab => (
              <button
                key={tab.key}
                style={{
                  ...styles.tab,
                  ...(activeTab === tab.key ? styles.tabActive : {}),
                  outline: 'none',
                  WebkitTapHighlightColor: 'transparent',
                }}
                onClick={e => {
                  setActiveTab(tab.key);
                  e.currentTarget.blur();
                }}
                title={tab.name}
                aria-label={tab.name}
              >
                {tab.icon}
              </button>
            ))}
          </div>

          {/* Dashboard Tab */}
          {activeTab === 'dashboard' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>📊 Today's Summary</div>
                <div style={{ fontSize: '16px', color: '#666', lineHeight: '2', fontWeight: '500' }}>
                  <div style={{ marginBottom: '1rem' }}>
                    <strong style={{ fontSize: '17px' }}>Date:</strong> {new Date(currentDate).toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}
                  </div>

                  {fastingStatus && (
                    <div style={{ marginBottom: '1rem' }}>
                      <strong style={{ fontSize: '17px' }}>Fasting:</strong> {fastingStatus.hours}h ({fastingStatus.start} – {fastingStatus.end})
                      <div style={{ color: fastingStatus.hours >= 16 ? '#27ae60' : '#f39c12', fontSize: '15px', marginTop: '0.3rem', fontWeight: '600' }}>
                        {fastingStatus.hours >= 16 ? '✓ Goal met!' : `${(16 - fastingStatus.hours).toFixed(1)}h to goal`}
                      </div>
                    </div>
                  )}

                  {todayData.weight && (
                    <div style={{ marginBottom: '1rem' }}>
                      <strong style={{ fontSize: '17px' }}>Weight:</strong> {todayData.weight[todayData.weight.length - 1].weight} kg
                      {todayData.weight[todayData.weight.length - 1].target && (
                        <div style={{ fontSize: '14px', color: '#999', marginTop: '0.3rem' }}>
                          Target: {todayData.weight[todayData.weight.length - 1].target} kg
                        </div>
                      )}
                    </div>
                  )}

                  {todayData.supplements && (
                    <div style={{ marginBottom: '1rem' }}>
                      <strong style={{ fontSize: '17px' }}>Supplements:</strong> {todayData.supplements.length} logged
                    </div>
                  )}

                  {(todayData.symptoms || todayData.food || todayData.medical || todayData.gym) && (
                    <div>
                      <strong style={{ fontSize: '17px' }}>Other entries:</strong>
                      {todayData.symptoms && ` Symptoms: ${todayData.symptoms.length}·`}
                      {todayData.food && ` Food: ${todayData.food.length}·`}
                      {todayData.medical && ` Medical: ${todayData.medical.length}·`}
                      {todayData.gym && ` Gym: ${todayData.gym.length}`}
                    </div>
                  )}
                </div>
              </div>

              {(dueSupps.logged.length > 0 || dueSupps.recurring.length > 0) && (
                <div style={styles.card}>
                  <div style={styles.cardTitle}>💊 Supplements Due</div>
                  <div style={{ fontSize: '16px', color: '#333', lineHeight: '2', fontWeight: '500' }}>
                    {dueSupps.recurring.map(supp => (
                      <div key={supp.id} style={{ 
                        marginBottom: '1.25rem',
                        padding: '1.25rem',
                        backgroundColor: '#fff3cd',
                        border: '2px solid #ffc107',
                        borderRadius: '8px',
                        fontWeight: '600',
                        fontSize: '18px'
                      }}>
                        <div style={{ color: '#856404' }}>⏰ {supp.name} (Daily)</div>
                        <div style={{ fontSize: '15px', color: '#856404', marginTop: '0.3rem' }}>
                          Scheduled: {supp.time}
                        </div>
                      </div>
                    ))}
                    {dueSupps.logged.map(supp => (
                      <div key={supp.id} style={{ 
                        marginBottom: '1.25rem',
                        padding: '1.25rem',
                        backgroundColor: '#fff3cd',
                        border: '2px solid #ffc107',
                        borderRadius: '8px',
                        fontWeight: '600',
                        fontSize: '18px'
                      }}>
                        <div style={{ color: '#856404' }}>⏰ {supp.name}</div>
                        <div style={{ fontSize: '15px', color: '#856404', marginTop: '0.3rem' }}>
                          Scheduled: {supp.time}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {dayTimeline.length > 0 && (
                <div style={styles.card}>
                  <div style={styles.cardTitle}>🕐 Day Timeline</div>
                  <div>
                    {dayTimeline.map(item => (
                      <div key={item.id} style={styles.entry}>
                        <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'flex-start' }}>
                          <div style={{ fontSize: '20px', minWidth: '28px' }}>{item.icon}</div>
                          <div style={{ flex: 1 }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', gap: '0.5rem', flexWrap: 'wrap' }}>
                              <strong>{item.label}</strong>
                              <span style={{ color: '#666', fontWeight: '600', fontSize: '16px' }}>
                                {item.time || 'No time set'}
                              </span>
                            </div>
                            {item.detail && (
                              <div style={{ marginTop: '0.3rem', fontSize: '14px', color: '#666' }}>{item.detail}</div>
                            )}
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {Object.keys(todayData).length === 0 && (
                <div style={styles.card}>
                  <div style={styles.emptyState}>No entries yet. Start tracking!</div>
                </div>
              )}
            </div>
          )}

          {/* Fasting Tab */}
          {activeTab === 'fasting' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>⏳ Log Fasting Window</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Fasting start time</label>
                  <input
                    type="time"
                    value={formData.fastingStart}
                    onChange={e => setFormData({ ...formData, fastingStart: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Fasting end time</label>
                  <input
                    type="time"
                    value={formData.fastingEnd}
                    onChange={e => setFormData({ ...formData, fastingEnd: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.fastingStart && formData.fastingEnd) {
                      addEntry('fasting', { start: formData.fastingStart, end: formData.fastingEnd });
                    }
                  }}
                  style={styles.button}
                >
                  Log Fasting Window
                </button>
              </div>

              {todayData.fasting && (
                <div>
                  <h3 style={{ fontSize: '14px', marginBottom: '0.75rem' }}>Today's Fasting Windows</h3>
                  {todayData.fasting.map(entry => (
                    <div key={entry.id} style={styles.entry}>
                      {entry.start} → {entry.end}
                      <div style={styles.entryMeta}>
                        Logged: {entry.timestamp}
                        <button
                          onClick={() => deleteEntry('fasting', entry.id)}
                          style={{
                            ...styles.deleteButton,
                            marginLeft: '0.5rem',
                          }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Supplements Tab */}
          {activeTab === 'supplements' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>📝 Log Today's Supplements</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Supplement name</label>
                  <input
                    type="text"
                    placeholder="e.g., Magnesium"
                    value={formData.supplement}
                    onChange={e => setFormData({ ...formData, supplement: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Time taken</label>
                  <input
                    type="time"
                    value={formData.supplementTime}
                    onChange={e => setFormData({ ...formData, supplementTime: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Notes (optional)</label>
                  <textarea
                    placeholder="e.g., Taken with food"
                    value={formData.supplementNotes}
                    onChange={e => setFormData({ ...formData, supplementNotes: e.target.value })}
                    style={styles.textarea}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.supplement) {
                      addEntry('supplements', {
                        name: formData.supplement,
                        time: formData.supplementTime || getCurrentTimeHHMM(),
                        notes: formData.supplementNotes,
                      });
                    }
                  }}
                  style={styles.button}
                >
                  Log Supplement
                </button>
              </div>

              {todayData.supplements && (
                <div>
                  <h3 style={{ fontSize: '18px', fontWeight: '700', marginBottom: '1rem' }}>Today's Supplements</h3>
                  {todayData.supplements.map(entry => (
                    <div key={entry.id} style={styles.entry}>
                      <strong>{entry.name}</strong> at {entry.time}
                      {entry.notes && <div style={{ marginTop: '0.3rem', fontSize: '12px', color: '#666' }}>Note: {entry.notes}</div>}
                      <div style={styles.entryMeta}>
                        Logged: {entry.timestamp}
                        <button
                          onClick={() => deleteEntry('supplements', entry.id)}
                          style={{
                            ...styles.deleteButton,
                            marginLeft: '0.5rem',
                          }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              <div style={styles.card}>
                <div style={styles.cardTitle}>📋 Set Up Daily Reminders</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Supplement name</label>
                  <input
                    type="text"
                    placeholder="e.g., Magnesium"
                    value={formData.recurringName}
                    onChange={e => setFormData({ ...formData, recurringName: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Time to remind me</label>
                  <input
                    type="time"
                    value={formData.recurringTime}
                    onChange={e => setFormData({ ...formData, recurringTime: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.recurringName && formData.recurringTime) {
                      setRecurringSupps(prev => ({
                        ...prev,
                        [Date.now()]: {
                          id: Date.now(),
                          name: formData.recurringName,
                          time: formData.recurringTime,
                        }
                      }));
                      setFormData({ ...formData, recurringName: '', recurringTime: '' });
                    }
                  }}
                  style={styles.button}
                >
                  Add Daily Reminder
                </button>
              </div>

              {Object.keys(recurringSupps).length > 0 && (
                <div style={styles.card}>
                  <div style={styles.cardTitle}>⏰ Your Daily Supplements</div>
                  {Object.values(recurringSupps).map(supp => (
                    <div key={supp.id} style={styles.entry}>
                      <strong style={{ fontSize: '18px' }}>{supp.name}</strong>
                      <div style={{ marginTop: '0.5rem', fontSize: '16px', color: '#666' }}>
                        Reminder at {supp.time}
                      </div>
                      <button
                        onClick={() => {
                          setRecurringSupps(prev => {
                            const newSupps = { ...prev };
                            delete newSupps[supp.id];
                            return newSupps;
                          });
                        }}
                        style={{
                          ...styles.deleteButton,
                          marginTop: '0.75rem',
                        }}
                      >
                        Delete
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Symptoms Tab */}
          {activeTab === 'symptoms' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>🌡️ Log Symptom</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Symptom</label>
                  <input
                    type="text"
                    placeholder="e.g., Headache"
                    value={formData.symptom}
                    onChange={e => setFormData({ ...formData, symptom: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Severity (1-5)</label>
                  <input
                    type="range"
                    min="1"
                    max="5"
                    value={formData.symptomLevel}
                    onChange={e => setFormData({ ...formData, symptomLevel: parseInt(e.target.value) })}
                    style={{ width: '100%' }}
                  />
                  <div style={{ textAlign: 'center', fontSize: '13px', color: '#666', marginTop: '0.3rem' }}>
                    Level: {formData.symptomLevel} / 5
                  </div>
                </div>
                <div style={styles.twoColumnForm}>
                  <div style={styles.formGroup}>
                    <label style={styles.label}>Date</label>
                    <input
                      type="date"
                      value={formData.symptomDate}
                      onChange={e => setFormData({ ...formData, symptomDate: e.target.value })}
                      style={styles.input}
                    />
                  </div>
                  <div style={styles.formGroup}>
                    <label style={styles.label}>Time</label>
                    <input
                      type="time"
                      value={formData.symptomTime}
                      onChange={e => setFormData({ ...formData, symptomTime: e.target.value })}
                      style={styles.input}
                    />
                  </div>
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Notes (optional)</label>
                  <textarea
                    placeholder="e.g., Started after lunch"
                    value={formData.symptomNotes}
                    onChange={e => setFormData({ ...formData, symptomNotes: e.target.value })}
                    style={styles.textarea}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.symptom) {
                      addEntry('symptoms', {
                        symptom: formData.symptom,
                        level: formData.symptomLevel,
                        notes: formData.symptomNotes,
                        date: formData.symptomDate || currentDate,
                        time: formData.symptomTime || getCurrentTimeHHMM(),
                      });
                    }
                  }}
                  style={styles.button}
                >
                  Log Symptom
                </button>
              </div>

              {todayData.symptoms && (
                <div>
                  <h3 style={{ fontSize: '14px', marginBottom: '0.75rem' }}>Today's Symptoms</h3>
                  {todayData.symptoms.map(entry => (
                    <div key={entry.id} style={styles.entry}>
                      <strong>{entry.symptom}</strong> — Level {entry.level}/5
                      {entry.notes && <div style={{ marginTop: '0.3rem', fontSize: '12px', color: '#666' }}>{entry.notes}</div>}
                      <div style={styles.entryMeta}>
                        Occurred: {entry.date} at {entry.time} · Logged: {entry.timestamp}
                        <button
                          onClick={() => deleteEntry('symptoms', entry.id)}
                          style={{
                            ...styles.deleteButton,
                            marginLeft: '0.5rem',
                          }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Weight Tab */}
          {activeTab === 'weight' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>📉 Log Weight</div>
                <div style={styles.twoColumnForm}>
                  <div style={styles.formGroup}>
                    <label style={styles.label}>Weight (kg)</label>
                    <input
                      type="number"
                      step="0.1"
                      placeholder="e.g., 75.5"
                      value={formData.weight}
                      onChange={e => setFormData({ ...formData, weight: e.target.value })}
                      style={styles.input}
                    />
                  </div>
                  <div style={styles.formGroup}>
                    <label style={styles.label}>Target weight (kg)</label>
                    <input
                      type="number"
                      step="0.1"
                      placeholder="e.g., 70"
                      value={formData.targetWeight}
                      onChange={e => setFormData({ ...formData, targetWeight: e.target.value })}
                      style={styles.input}
                    />
                  </div>
                </div>
                <button
                  onClick={() => {
                    if (formData.weight) {
                      addEntry('weight', {
                        weight: formData.weight,
                        target: formData.targetWeight,
                      });
                    }
                  }}
                  style={styles.button}
                >
                  Log Weight
                </button>
              </div>

              {todayData.weight && (
                <div>
                  <h3 style={{ fontSize: '14px', marginBottom: '0.75rem' }}>Today's Weight</h3>
                  {todayData.weight.map(entry => (
                    <div key={entry.id} style={styles.entry}>
                      <strong>{entry.weight} kg</strong>
                      {entry.target && <div style={{ marginTop: '0.3rem', fontSize: '12px', color: '#666' }}>Target: {entry.target} kg</div>}
                      <div style={styles.entryMeta}>
                        Logged: {entry.timestamp}
                        <button
                          onClick={() => deleteEntry('weight', entry.id)}
                          style={{
                            ...styles.deleteButton,
                            marginLeft: '0.5rem',
                          }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Food Tab */}
          {activeTab === 'food' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>🍎 Log Food</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>What did you eat?</label>
                  <textarea
                    placeholder="e.g., Grilled chicken, rice, and broccoli"
                    value={formData.foodNote}
                    onChange={e => setFormData({ ...formData, foodNote: e.target.value })}
                    style={styles.textarea}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Time (optional)</label>
                  <input
                    type="time"
                    value={formData.foodTime}
                    onChange={e => setFormData({ ...formData, foodTime: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.foodNote) {
                      addEntry('food', {
                        note: formData.foodNote,
                        time: formData.foodTime || getCurrentTimeHHMM(),
                      });
                    }
                  }}
                  style={styles.button}
                >
                  Log Food
                </button>
              </div>

              {todayData.food && (
                <div>
                  <h3 style={{ fontSize: '14px', marginBottom: '0.75rem' }}>Today's Food</h3>
                  {todayData.food.map(entry => (
                    <div key={entry.id} style={styles.entry}>
                      <div style={{ fontSize: '13px' }}>{entry.note}</div>
                      <div style={{ marginTop: '0.3rem', fontSize: '12px', color: '#999' }}>at {entry.time}</div>
                      <div style={styles.entryMeta}>
                        Logged: {entry.timestamp}
                        <button
                          onClick={() => deleteEntry('food', entry.id)}
                          style={{
                            ...styles.deleteButton,
                            marginLeft: '0.5rem',
                          }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Medical Tab */}
          {activeTab === 'medical' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>🏥 Log Medical Event</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Medical event</label>
                  <input
                    type="text"
                    placeholder="e.g., Doctor visit, blood test, vaccination"
                    value={formData.medicalEvent}
                    onChange={e => setFormData({ ...formData, medicalEvent: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Notes (optional)</label>
                  <textarea
                    placeholder="e.g., Results showed..."
                    value={formData.medicalNotes}
                    onChange={e => setFormData({ ...formData, medicalNotes: e.target.value })}
                    style={styles.textarea}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.medicalEvent) {
                      addEntry('medical', {
                        event: formData.medicalEvent,
                        notes: formData.medicalNotes,
                      });
                    }
                  }}
                  style={styles.button}
                >
                  Log Medical Event
                </button>
              </div>

              {todayData.medical && (
                <div>
                  <h3 style={{ fontSize: '14px', marginBottom: '0.75rem' }}>Today's Medical Events</h3>
                  {todayData.medical.map(entry => (
                    <div key={entry.id} style={styles.entry}>
                      <strong>{entry.event}</strong>
                      {entry.notes && <div style={{ marginTop: '0.3rem', fontSize: '12px', color: '#666' }}>{entry.notes}</div>}
                      <div style={styles.entryMeta}>
                        Logged: {entry.timestamp}
                        <button
                          onClick={() => deleteEntry('medical', entry.id)}
                          style={{
                            ...styles.deleteButton,
                            marginLeft: '0.5rem',
                          }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}

          {/* Gym Tab */}
          {activeTab === 'gym' && (
            <div style={styles.content}>
              <div style={styles.card}>
                <div style={styles.cardTitle}>🏋️‍♀️ Log Gym Activity</div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Gym activity</label>
                  <input
                    type="text"
                    placeholder="e.g., Planet Fitness — Chest & Triceps"
                    value={formData.gymActivity}
                    onChange={e => setFormData({ ...formData, gymActivity: e.target.value })}
                    style={styles.input}
                  />
                </div>
                <div style={styles.formGroup}>
                  <label style={styles.label}>Notes (optional)</label>
                  <textarea
                    placeholder="e.g., 60 min, felt strong"
                    value={formData.gymNotes}
                    onChange={e => setFormData({ ...formData, gymNotes: e.target.value })}
                    style={styles.textarea}
                  />
                </div>
                <button
                  onClick={() => {
                    if (formData.gymActivity) {
                      addEntry('gym', {
                        activity: formData.gymActivity,
                        notes: formData.gymNotes,
                      });
                    }
                  }}
                  style={styles.button}
                >
                  Log Gym Activity
                </button>
              </div>

              {todayData.gym && (
                <div>
                  <h3 style={{ fontSize: '14px', marginBottom: '0.75rem' }}>Today's Gym Activity</h3>
                  {todayData.gym.map(entry => (
                    <div key={entry.id} style={styles.entry}>
                      <strong>{entry.activity}</strong>
                      {entry.notes && <div style={{ marginTop: '0.3rem', fontSize: '12px', color: '#666' }}>{entry.notes}</div>}
                      <div style={styles.entryMeta}>
                        Logged: {entry.timestamp}
                        <button
                          onClick={() => deleteEntry('gym', entry.id)}
                          style={{
                            ...styles.deleteButton,
                            marginLeft: '0.5rem',
                          }}
                        >
                          Delete
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DailyTrackerApp />);
  </script>
</body>
</html>
