<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💪 I AM SPARTACUS 💪</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      background-color: #fafafa;
    }
    #root {
      width: 100%;
    }
    button {
      -webkit-appearance: none;
      appearance: none;
      -webkit-tap-highlight-color: transparent;
    }
    button:focus,
    button:focus-visible,
    button:active {
      outline: none !important;
      box-shadow: none !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DailyTrackerApp = () => {
      const [entries, setEntries] = useState({});
      const [recurringSupps, setRecurringSupps] = useState({});
      const [activeFast, setActiveFast] = useState(null);
      const [nowTick, setNowTick] = useState(0);
      const [currentDate, setCurrentDate] = useState(() => {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      });
      const [activeTab, setActiveTab] = useState('dashboard');
      const [formData, setFormData] = useState({
        fastingStart: '',
        fastingEnd: '',
        supplement: '',
        supplementTime: '',
        supplementNotes: '',
        symptom: '',
        symptomLevel: 3,
        symptomNotes: '',
        symptomDate: '',
        symptomTime: '',
        weight: '',
        targetWeight: '',
        foodNote: '',
        foodTime: '',
        medicalEvent: '',
        medicalNotes: '',
        gymActivity: '',
        gymNotes: '',
        gymTime: '',
        recurringName: '',
        recurringTime: '',
        recurringFrequency: 'daily',
        recurringDayOfWeek: '1',
      });

      // Load data from localStorage
      useEffect(() => {
        const saved = localStorage.getItem('trackerData');
        if (saved) {
          try {
            setEntries(JSON.parse(saved));
          } catch (e) {
            console.error('Failed to load saved data');
          }
        }
        const savedRecurring = localStorage.getItem('recurringSupps');
        if (savedRecurring) {
          try {
            setRecurringSupps(JSON.parse(savedRecurring));
          } catch (e) {
            console.error('Failed to load recurring supps');
          }
        }
        const savedActiveFast = localStorage.getItem('activeFast');
        if (savedActiveFast) {
          try {
            setActiveFast(JSON.parse(savedActiveFast));
          } catch (e) {
            console.error('Failed to load active fast');
          }
        }
      }, []);

      // Tick every 30s so the live elapsed-fasting display stays current
      useEffect(() => {
        const interval = setInterval(() => setNowTick(t => t + 1), 30000);
        return () => clearInterval(interval);
      }, []);

      // Save active fast to localStorage
      useEffect(() => {
        if (activeFast) {
          localStorage.setItem('activeFast', JSON.stringify(activeFast));
        } else {
          localStorage.removeItem('activeFast');
        }
      }, [activeFast]);

      // Save to localStorage whenever entries change
      useEffect(() => {
        localStorage.setItem('trackerData', JSON.stringify(entries));
      }, [entries]);

      // Save recurring supps to localStorage
      useEffect(() => {
        localStorage.setItem('recurringSupps', JSON.stringify(recurringSupps));
      }, [recurringSupps]);

      const dateKey = currentDate;

      // Parse a 'YYYY-MM-DD' string as a LOCAL date (avoids the classic JS bug where
      // new Date('YYYY-MM-DD') is parsed as UTC midnight and can display as the previous day)
      const parseLocalDate = (dateStr) => {
        const [y, m, d] = dateStr.split('-').map(Number);
        return new Date(y, m - 1, d);
      };

      // Format a Date object as 'YYYY-MM-DD' using LOCAL date parts (avoids toISOString(),
      // which converts to UTC first and can shift the date near midnight in some timezones)
      const formatDateLocal = (date) => {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const getCurrentTimeHHMM = () => {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        return `${hh}:${mm}`;
      };

      const startFast = () => {
        const now = new Date();
        setActiveFast({
          startDateKey: formatDateLocal(now),
          startTime: getCurrentTimeHHMM(),
          startTimestampMs: now.getTime(),
        });
      };

      const stopFast = () => {
        if (!activeFast) return;
        const endTime = getCurrentTimeHHMM();
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });
        const startKey = activeFast.startDateKey;
        setEntries(prev => {
          const prevDay = prev[startKey] || {};
          const prevFasting = Array.isArray(prevDay.fasting) ? prevDay.fasting : [];
          return {
            ...prev,
            [startKey]: {
              ...prevDay,
              fasting: [...prevFasting, { start: activeFast.startTime, end: endTime, timestamp, id: Date.now() }],
            },
          };
        });
        setActiveFast(null);
      };

      const getElapsedFastLabel = () => {
        if (!activeFast) return '';
        const elapsedMs = Date.now() - activeFast.startTimestampMs;
        const totalMinutes = Math.max(0, Math.floor(elapsedMs / 60000));
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        return `${hours}h ${minutes}m`;
      };

      const formatTime12h = (time24) => {
        if (!time24 || time24 === 'No time set') return time24 || 'No time set';
        const [hStr, mStr] = time24.split(':');
        let h = parseInt(hStr, 10);
        const suffix = h >= 12 ? 'PM' : 'AM';
        h = h % 12;
        if (h === 0) h = 12;
        return `${h}:${mStr} ${suffix}`;
      };

      const dayNames = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const selectedDayOfWeek = parseLocalDate(currentDate).getDay();

      const isSuppScheduledToday = (supp) => {
        if (!supp.frequency || supp.frequency === 'daily') return true;
        if (supp.frequency === 'weekly') return parseInt(supp.dayOfWeek, 10) === selectedDayOfWeek;
        return true;
      };

      const getTodayEntries = () => {
        return entries[dateKey] || {};
      };

      const addEntry = (category, data) => {
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });

        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: Array.isArray(prev[dateKey]?.[category])
              ? [...prev[dateKey][category], { ...data, timestamp, id: Date.now() }]
              : [{ ...data, timestamp, id: Date.now() }],
          },
        }));

        // Reset form
        setFormData({
          fastingStart: '',
          fastingEnd: '',
          supplement: '',
          supplementTime: '',
          supplementNotes: '',
          symptom: '',
          symptomLevel: 3,
          symptomNotes: '',
          symptomDate: '',
          symptomTime: '',
          weight: '',
          targetWeight: '',
          foodNote: '',
          foodTime: '',
          medicalEvent: '',
          medicalNotes: '',
          gymActivity: '',
          gymNotes: '',
          gymTime: '',
          recurringName: '',
          recurringTime: '',
          recurringFrequency: 'daily',
          recurringDayOfWeek: '1',
        });
        setActiveTab('dashboard');
        setTimeout(() => {
          const el = document.getElementById('day-timeline-card');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
      };

      const deleteEntry = (category, id) => {
        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: prev[dateKey][category].filter(item => item.id !== id),
          },
        }));
      };

      const [editingId, setEditingId] = useState(null);
      const [editingCategory, setEditingCategory] = useState(null);
      const [editData, setEditData] = useState({});

      const startEdit = (category, entry) => {
        setEditingCategory(category);
        setEditingId(entry.id);
        setEditData({ ...entry });
      };

      const cancelEdit = () => {
        setEditingCategory(null);
        setEditingId(null);
        setEditData({});
      };

      const saveEdit = (category) => {
        setEntries(prev => ({
          ...prev,
          [dateKey]: {
            ...prev[dateKey],
            [category]: prev[dateKey][category].map(item =>
              item.id === editingId ? { ...item, ...editData } : item
            ),
          },
        }));
        cancelEdit();
      };

      const isEditing = (category, id) => editingCategory === category && editingId === id;

      const todayData = getTodayEntries();

      // Calculate fasting status
      const getFastingStatus = () => {
        const fast = todayData.fasting?.[0];
        if (!fast) return null;

        const start = new Date(`${currentDate}T${fast.start}`);
        const end = new Date(`${currentDate}T${fast.end}`);
        if (end < start) end.setDate(end.getDate() + 1);

        const hours = (end - start) / (1000 * 60 * 60);
        return { hours: Math.round(hours * 10) / 10, start: fast.start, end: fast.end };
      };

      const getDueSupplements = () => {
        const now = new Date();
        const currentHour = String(now.getHours()).padStart(2, '0');
        const currentMin = String(now.getMinutes()).padStart(2, '0');
        const currentTime = `${currentHour}:${currentMin}`;

        const dismissed = todayData.dueDismissed || [];
        
        // Check each logged supplement to see if it's due (past its scheduled time)
        const dueSupps = (todayData.supplements || []).filter(supp => {
          if (!supp.time || supp.time === 'No time set') return false;
          if (supp.time > currentTime) return false;
          return !dismissed.includes('logged-' + supp.id);
        });

        // Also check recurring supplements
        const dueRecurring = Object.values(recurringSupps).filter(supp => {
          if (!supp.time) return false;
          if (supp.time > currentTime) return false;
          return !dismissed.includes('recurring-' + supp.id);
        });
        
        return { logged: dueSupps, recurring: dueRecurring };
      };

      const isRecurringDone = (supp) => {
        const dismissed = todayData.dueDismissed || [];
        return dismissed.includes(`recurring-${supp.id}`);
      };

      const uncheckRecurring = (supp) => {
        const key = `recurring-${supp.id}`;
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              dueDismissed: (prevDay.dueDismissed || []).filter(k => k !== key),
            },
          };
        });
      };

      const confirmRecurringDone = (supp, chosenTime) => {
        const key = `recurring-${supp.id}`;
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });
        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          const prevSupplements = Array.isArray(prevDay.supplements) ? prevDay.supplements : [];
          const newEntryId = Date.now();
          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              supplements: [...prevSupplements, { name: supp.name, time: chosenTime, notes: '', timestamp, id: newEntryId }],
              dueDismissed: [...(prevDay.dueDismissed || []), key, `logged-${newEntryId}`],
            },
          };
        });
      };

      const [confirmingSuppId, setConfirmingSuppId] = useState(null);
      const [confirmTime, setConfirmTime] = useState('');

      const [editingRecurringId, setEditingRecurringId] = useState(null);
      const [editRecurringData, setEditRecurringData] = useState({});

      const startEditRecurring = (supp) => {
        setEditingRecurringId(supp.id);
        setEditRecurringData({ ...supp });
      };

      const cancelEditRecurring = () => {
        setEditingRecurringId(null);
        setEditRecurringData({});
      };

      const saveEditRecurring = () => {
        setRecurringSupps(prev => ({
          ...prev,
          [editingRecurringId]: {
            ...prev[editingRecurringId],
            name: editRecurringData.name,
            time: editRecurringData.time,
            frequency: editRecurringData.frequency || 'daily',
            dayOfWeek: editRecurringData.frequency === 'weekly' ? editRecurringData.dayOfWeek : undefined,
          },
        }));
        cancelEditRecurring();
      };

      const deleteRecurring = (id) => {
        setRecurringSupps(prev => {
          const newSupps = { ...prev };
          delete newSupps[id];
          return newSupps;
        });
        if (editingRecurringId === id) cancelEditRecurring();
      };

      const markDueDone = (type, supp) => {
        const key = `${type}-${supp.id}`;
        const timestamp = new Date().toLocaleTimeString('en-US', {
          hour: '2-digit',
          minute: '2-digit',
          hour12: true,
        });

        setEntries(prev => {
          const prevDay = prev[dateKey] || {};
          const prevSupplements = Array.isArray(prevDay.supplements) ? prevDay.supplements : [];
          const prevDismissed = prevDay.dueDismissed || [];
          let newSupplements = prevSupplements;
          let newDismissed = [...prevDismissed, key];

          if (type === 'recurring') {
            const newEntryId = Date.now();
            newSupplements = [...prevSupplements, { name: supp.name, time: supp.time, notes: '', timestamp, id: newEntryId }];
            // Prevent the freshly-logged entry from immediately showing up as its own "due" reminder
            newDismissed = [...newDismissed, `logged-${newEntryId}`];
          }

          return {
            ...prev,
            [dateKey]: {
              ...prevDay,
              supplements: newSupplements,
              dueDismissed: newDismissed,
            },
          };
        });

        setActiveTab('supplements');

        const targetId = type === 'logged' ? `entry-supplements-${supp.id}` : 'today-supplements-list';
        setTimeout(() => {
          const el = document.getElementById(targetId);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }, 100);
      };

      const fastingStatus = getFastingStatus();
      const dueSupps = getDueSupplements();

      const getDayTimeline = () => {
        const items = [];

        (todayData.supplements || []).forEach(entry => {
          items.push({
            id: 'supp-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '💊',
            label: entry.name,
            detail: entry.notes || '',
            category: 'supplements',
            entry: entry,
          });
        });

        (todayData.symptoms || []).forEach(entry => {
          items.push({
            id: 'symp-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🤒',
            label: `${entry.symptom} — Level ${entry.level}/5`,
            detail: entry.notes || '',
            category: 'symptoms',
            entry: entry,
          });
        });

        (todayData.food || []).forEach(entry => {
          items.push({
            id: 'food-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🍎',
            label: entry.note,
            detail: '',
            category: 'food',
            entry: entry,
          });
        });

        (todayData.gym || []).forEach(entry => {
          items.push({
            id: 'gym-' + entry.id,
            time: entry.time && entry.time !== 'No time set' ? entry.time : null,
            icon: '🏋️‍♀️',
            label: entry.activity,
            detail: entry.notes || '',
            category: 'gym',
            entry: entry,
          });
        });

        // Sort by time (entries without a time go to the end)
        items.sort((a, b) => {
          if (!a.time && !b.time) return 0;
          if (!a.time) return 1;
          if (!b.time) return -1;
          return a.time.localeCompare(b.time);
        });

        return items;
      };

      const dayTimeline = getDayTimeline();

      const styles = {
        container: {
          maxWidth: '600px',
          margin: '0 auto',
          fontFamily: 'system-ui, -apple-system, sans-serif',
          backgroundColor: '#ffffff',
          minHeight: '100vh',
          padding: '2rem 1.5rem',
        },
        header: {
          display: 'flex',
          justifyContent: 'center',
          alignItems: 'center',
          marginBottom: '2.5rem',
          borderBottom: '2px solid #e0e0e0',
          paddingBottom: '2rem',
        },
        title: {
          fontSize: '30px',
          fontWeight: '700',
          margin: 0,
          letterSpacing: '-0.5px',
          textAlign: 'center',
        },
        subtitle: {
          fontSize: '15px',
          fontWeight: '500',
          color: '#666',
          margin: 0,
          marginTop: '0.5rem',
          textAlign: 'center',
        },
        dateNav: {
          display: 'flex',
          flexDirection: 'column',
          gap: '0.75rem',
          marginBottom: '2.5rem',
        },
        dateNavRow: {
          display: 'flex',
          gap: '0.75rem',
        },
        dateButton: {
          padding: '1rem 0.5rem',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          backgroundColor: '#fff',
          cursor: 'pointer',
          fontSize: '16px',
          color: '#666',
          fontWeight: '600',
          minHeight: '52px',
          flex: 1,
        },
        dateButtonActive: {
          backgroundColor: '#333',
          color: '#fff',
          border: '2px solid #333',
        },
        tabs: {
          display: 'flex',
          gap: '0.5rem',
          marginBottom: '2.5rem',
          borderBottom: '2px solid #e0e0e0',
          overflowX: 'auto',
          paddingBottom: '1rem',
        },
        tab: {
          padding: '0.75rem',
          border: '2px solid transparent',
          backgroundColor: 'transparent',
          cursor: 'pointer',
          fontSize: '26px',
          color: '#666',
          borderRadius: '8px',
          minWidth: '52px',
          minHeight: '52px',
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          flexShrink: 0,
          lineHeight: 1,
        },
        tabActive: {
          backgroundColor: '#333',
          borderColor: '#333',
        },
        content: {
          marginBottom: '2rem',
        },
        card: {
          backgroundColor: '#f9f9f9',
          border: '2px solid #e0e0e0',
          borderRadius: '12px',
          padding: '2rem',
          marginBottom: '2rem',
        },
        cardTitle: {
          fontSize: '24px',
          fontWeight: '700',
          color: '#333',
          marginBottom: '1.5rem',
          display: 'flex',
          justifyContent: 'space-between',
          alignItems: 'center',
          letterSpacing: '-0.3px',
        },
        cardLabel: {
          fontSize: '18px',
          color: '#666',
          marginTop: '1.25rem',
          marginBottom: '0.6rem',
          fontWeight: '600',
        },
        formGroup: {
          marginBottom: '2rem',
        },
        label: {
          display: 'block',
          fontSize: '18px',
          fontWeight: '700',
          marginBottom: '0.8rem',
          color: '#333',
          letterSpacing: '-0.2px',
        },
        input: {
          width: '100%',
          padding: '1.25rem',
          fontSize: '20px',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          boxSizing: 'border-box',
          minHeight: '56px',
        },
        select: {
          width: '100%',
          padding: '1.25rem',
          fontSize: '20px',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          boxSizing: 'border-box',
          minHeight: '56px',
        },
        textarea: {
          width: '100%',
          padding: '1.25rem',
          fontSize: '20px',
          border: '2px solid #d0d0d0',
          borderRadius: '8px',
          minHeight: '120px',
          boxSizing: 'border-box',
          fontFamily: 'inherit',
          resize: 'vertical',
        },
        button: {
          padding: '1.25rem 2rem',
          backgroundColor: '#333',
          color: '#fff',
          border: 'none',
          borderRadius: '8px',
          cursor: 'pointer',
          fontSize: '20px',
          fontWeight: '700',
          minHeight: '56px',
          width: '100%',
          letterSpacing: '-0.3px',
        },
        deleteButton: {
          padding: '0.6rem 0.9rem',
          backgroundColor: '#e74c3c',
          color: '#fff',
          border: 'none',
          borderRadius: '4px',
          cursor: 'pointer',
          fontSize: '15px',
          fontWeight: '600',
        },
        editButton: {
          padding: '0.6rem 0.9rem',
          backgroundColor: '#f0f0f0',
          color: '#333',
          border: '2px solid #d0d0d0',
          borderRadius: '4px',
          cursor: 'pointer',
          fontSize: '15px',
          fontWeight: '600',
        },
        saveButton: {
          padding: '0.6rem 0.9rem',
          backgroundColor: '#27ae60',
          color: '#fff',
          border: 'none',
          borderRadius: '4px',
          cursor: 'pointer',
          fontSize: '15px',
          fontWeight: '600',
        },
        cancelButton: {
          padding: '0.6rem 0.9rem',
          backgroundColor: '#f0f0f0',
          color: '#666',
          border: '2px solid #d0d0d0',
          borderRadius: '4px',
          cursor: 'pointer',
          fontSize: '15px',
          fontWeight: '600',
        },
        editInput: {
          width: '100%',
          padding: '0.6rem',
          fontSize: '16px',
          border: '2px solid #d0d0d0',
          borderRadius: '6px',
          boxSizing: 'border-box',
          marginBottom: '0.5rem',
        },
        entry: {
          backgroundColor: '#fff',
          border: '2px solid #e0e0e0',
          borderRadius: '10px',
          padding: '1.5rem',
          marginBottom: '1.25rem',
          fontSize: '18px',
          color: '#333',
          lineHeight: '1.8',
          fontWeight: '500',
        },
        entryMeta: {
          fontSize: '16px',
          color: '#999',
          marginTop: '0.75rem',
          fontWeight: '400',
        },
        emptyState: {
          textAlign: 'center',
          color: '#999',
          fontSize: '18px',
          padding: '2.5rem 1.5rem',
        },
        twoColumnForm: {
          display: 'grid',
          gridTemplateColumns: '1fr 1fr',
          gap: '1.5rem',
        },
      };

      return (
        <div style={styles.container}>
          <div style={styles.header}>
            <div
              onClick={() => setActiveTab('dashboard')}
              style={{ cursor: 'pointer' }}
            >
              <h1 style={styles.title}>💪 I AM SPARTACUS 💪</h1>
              <p style={styles.subtitle}>My Daily Tracker for Health and Activity</p>
            </div>
          </div>

          {/* Date Navigation */}
          <div style={styles.dateNav}>
            <div style={styles.dateNavRow}>
              <button
                style={{ ...styles.dateButton, outline: 'none', WebkitTapHighlightColor: 'transparent' }}
                onClick={e => {
                  const d = parseLocalDate(currentDate);
                  d.setDate(d.getDate() - 1);
                  setCurrentDate(formatDateLocal(d));
                  e.currentTarget.blur();
                }}
              >
                ← Prev
              </button>
              <button
                style={{
                  ...styles.dateButton,
